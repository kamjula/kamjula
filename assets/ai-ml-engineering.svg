<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
<title id="title">AI systems engineering visual</title>
<desc id="desc">Minimal professional engineering card for Python, RAG, FastAPI, and evaluation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0f1c"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7dd3fc"/>
    <stop offset="100%" stop-color="#c4b5fd"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="518" height="358" rx="24" fill="url(#bg)" stroke="#243244" stroke-width="2"/>

<text x="40" y="54" fill="#e5e7eb" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">AI SYSTEMS ENGINEERING</text>
<text x="40" y="88" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="13">Python · RAG · FastAPI · Evaluation</text>

<g transform="translate(40,120)">
  <rect width="440" height="145" rx="16" fill="#0f172a" stroke="#263446"/>
  <circle cx="22" cy="20" r="4" fill="#ef4444"/>
  <circle cx="38" cy="20" r="4" fill="#f59e0b"/>
  <circle cx="54" cy="20" r="4" fill="#22c55e"/>

  <text x="22" y="56" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">$ build_ai_system</text>
  <text x="22" y="83" fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">data  →  detect  →  retrieve</text>
  <text x="22" y="108" fill="#ddd6fe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">       →  serve   →  evaluate</text>
  <line x1="22" y1="126" x2="402" y2="126" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
</g>

<g transform="translate(40,292)" font-family="Inter,Arial,sans-serif">
  <rect x="0" y="0" width="90" height="32" rx="16" fill="#111c2f" stroke="#334155"/>
  <text x="45" y="21" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="700">RELIABLE</text>

  <rect x="105" y="0" width="100" height="32" rx="16" fill="#111c2f" stroke="#334155"/>
  <text x="155" y="21" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="700">GROUNDED</text>

  <rect x="220" y="0" width="108" height="32" rx="16" fill="#111c2f" stroke="#334155"/>
  <text x="274" y="21" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="700">MEASURABLE</text>

  <rect x="343" y="0" width="97" height="32" rx="16" fill="#111c2f" stroke="#334155"/>
  <text x="391.5" y="21" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="700">DEPLOYED</text>
</g>
</svg>